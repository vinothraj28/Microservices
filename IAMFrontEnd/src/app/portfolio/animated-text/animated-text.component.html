<p class="animated-text" #root>
  @for (char of chars(); track $index) {
    <span class="char-wrap">
      <span class="char-placeholder">{{ displayChar(char) }}</span>
      <span class="char-anim" [style.opacity]="opacities()[$index]">{{
        displayChar(char)
      }}</span>
    </span>
  }
</p>
