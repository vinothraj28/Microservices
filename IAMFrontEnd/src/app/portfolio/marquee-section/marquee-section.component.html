<section class="marquee" #section>
  <div class="marquee__row" [style.transform]="rowOneTransform()" style="will-change: transform">
    @for (src of rowOne; track $index) {
      <img class="marquee__tile" [src]="src" alt="" loading="lazy" />
    }
  </div>
  <div class="marquee__row" [style.transform]="rowTwoTransform()" style="will-change: transform">
    @for (src of rowTwo; track $index) {
      <img class="marquee__tile" [src]="src" alt="" loading="lazy" />
    }
  </div>
</section>
