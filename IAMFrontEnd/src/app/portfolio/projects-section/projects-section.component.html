<section class="projects" id="projects">
  <h2 class="hero-heading projects__heading">Project</h2>

  @for (project of projects; track project.number; let i = $index) {
    <div class="projects__slot" #slot>
      <article
        class="projects__card"
        [style.top]="cardTop(i)"
        [style.transform]="'scale(' + scales()[i] + ')'"
        style="will-change: transform"
      >
        <div class="projects__meta">
          <span class="projects__number">{{ project.number }}</span>
          <div class="projects__titles">
            <p>{{ project.category }}</p>
            <h3>{{ project.name }}</h3>
          </div>
          <app-live-project-button />
        </div>
        <div class="projects__grid">
          <div class="projects__col projects__col--left">
            <img [src]="project.col1[0]" alt="" loading="lazy" class="projects__img projects__img--sm" />
            <img [src]="project.col1[1]" alt="" loading="lazy" class="projects__img projects__img--md" />
          </div>
          <div class="projects__col projects__col--right">
            <img [src]="project.col2" alt="" loading="lazy" class="projects__img projects__img--tall" />
          </div>
        </div>
      </article>
    </div>
  }
</section>
