<section class="services" id="price">
  <h2 class="services__heading">Services</h2>
  <div class="services__list">
    @for (service of services; track service.number; let i = $index) {
      <app-fade-in [delay]="i * 0.1" [y]="30">
        <article class="services__item">
          <span class="services__number">{{ service.number }}</span>
          <div class="services__body">
            <h3>{{ service.name }}</h3>
            <p>{{ service.description }}</p>
          </div>
        </article>
      </app-fade-in>
    }
  </div>
</section>
