<!-- base.component.html -->
<div class="app-shell">
  <!-- Header -->
  <header class="app-shell__header">
    <div class="header-left">
      <div class="app-shell__brand">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2m0 18c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8m3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5m-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5 7.67 11 8.5 11m3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z"
          />
        </svg>
        <span>BookQuick</span>
      </div>
    </div>

    <div class="header-center">
      <nav class="navbar">
        <a
          href="#"
          class="nav-item"
          routerLink="/base/dashboard"
          routerLinkActive="active"
        >
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
          </svg>
          <span>Dashboard</span>
        </a>

        <div class="nav-item-group">
          <button class="nav-item" (click)="toggleMovieMenu()">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M18 3H6c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H6V5h12v14zm-5.04-6.71l2.75 3.54h3.29L17 9h-4l-2.04 2.71V9h-4v8h4v-4.71z"
              />
            </svg>
            <span>Movies</span>
            <svg
              class="chevron"
              [class.open]="isMovieMenuOpen"
              viewBox="0 0 24 24"
              fill="currentColor"
            >
              <path d="M7 10l5 5 5-5z" />
            </svg>
          </button>
          <div class="dropdown-menu" *ngIf="isMovieMenuOpen">
            <a
              class="dropdown-item"
              routerLink="/base/movie/add"
              routerLinkActive="active"
            >
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" />
              </svg>
              Create Movie
            </a>
            <a
              class="dropdown-item"
              routerLink="/base/movie/list"
              routerLinkActive="active"
            >
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path
                  d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"
                />
              </svg>
              List Movies
            </a>
          </div>
        </div>

        <div class="nav-item-group">
          <button class="nav-item" (click)="toggleTheaterMenu()">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 12h-8v2h8v-2zm0-3h-8v2h8V11zm0-3H4V6h14v2z"
              />
            </svg>
            <span>Theaters</span>
            <svg
              class="chevron"
              [class.open]="isTheaterMenuOpen"
              viewBox="0 0 24 24"
              fill="currentColor"
            >
              <path d="M7 10l5 5 5-5z" />
            </svg>
          </button>
          <div class="dropdown-menu" *ngIf="isTheaterMenuOpen">
            <a
              class="dropdown-item"
              routerLink="/base/theater/add"
              routerLinkActive="active"
            >
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" />
              </svg>
              Add Theater
            </a>
            <a
              class="dropdown-item"
              routerLink="/base/theater/list"
              routerLinkActive="active"
            >
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path
                  d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"
                />
              </svg>
              List Theaters
            </a>
          </div>
        </div>

        <a
          href="#"
          class="nav-item"
          routerLink="/base/show"
          routerLinkActive="active"
        >
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"
            />
          </svg>
          <span>Shows</span>
        </a>

        <a
          href="#"
          class="nav-item"
          routerLink="/base/booking"
          routerLinkActive="active"
        >
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M17 12h-5v5h5v-5zM16 1v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2h-1V1h-2zm3 18H5V8h14v11z"
            />
          </svg>
          <span>Bookings</span>
        </a>
      </nav>
    </div>

    <div class="header-right">
      <div class="search-bar">
        <input type="text" placeholder="Search..." class="search-input" />
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"
          />
        </svg>
      </div>

      <button class="icon-btn notification-btn">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"
          />
        </svg>
        <span class="notification-badge">3</span>
      </button>

      <div class="user-menu">
        <button class="user-avatar" (click)="toggleUserMenu()">
          <img src="https://via.placeholder.com/32" alt="User" />
        </button>
        <div class="user-dropdown" *ngIf="isUserMenuOpen">
          <div class="user-info">
            <p class="user-name">John Doe</p>
            <p class="user-email">john&#64;example.com</p>
          </div>
          <div class="dropdown-divider"></div>
          <a class="dropdown-item">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"
              />
            </svg>
            Profile
          </a>
          <a class="dropdown-item">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.62l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.48.1.62l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.1.62l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.48-.12-.62l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"
              />
            </svg>
            Settings
          </a>
          <a class="dropdown-item">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M17 12h-5v5h5v-5zM16 1v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2h-1V1h-2zm3 18H5V8h14v11z"
              />
            </svg>
            Help
          </a>
          <div class="dropdown-divider"></div>
          <button class="dropdown-item logout">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"
              />
            </svg>
            Logout
          </button>
        </div>
      </div>
    </div>
  </header>

  <div class="app-shell__body">
    <main class="app-shell__main">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
