name: Docker Build & Push

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: docker.io
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Profile Backend Service
          - service_name: profile
            dockerfile: profile/profile/Dockerfile
            image_repo: removino68/profile-backend-ms
            context: .

          # Gateway Backend Service
          - service_name: gateway
            dockerfile: gateway/gateway/Dockerfile
            image_repo: removino68/gateway-backend-ms
            context: .

          # Movie Backend Service
          - service_name: movie
            dockerfile: movie/movie/Dockerfile
            image_repo: removino68/movie-backend-ms
            context: .

          # Frontend Service
          - service_name: frontend
            dockerfile: IAMFrontEnd/Dockerfile
            image_repo: removino68/iam-frontend-ms
            context: IAMFrontEnd

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        if: github.event_name != 'pull_request'

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image_repo }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image - ${{ matrix.service_name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ matrix.image_repo }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ matrix.image_repo }}:buildcache,mode=max

      - name: Image digest - ${{ matrix.service_name }}
        run: echo ${{ steps.meta.outputs.digest }}
