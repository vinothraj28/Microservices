name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build shared proto
        working-directory: SharedProto
        run: mvn -B -ntp clean install

      - name: Test profile service
        working-directory: profile/profile
        run: mvn -B -ntp clean test

      - name: Test movie service
        working-directory: movie/movie
        run: mvn -B -ntp clean test

      - name: Test gateway service
        working-directory: gateway/gateway
        run: mvn -B -ntp clean test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: IAMFrontEnd/package-lock.json

      - name: Install dependencies
        working-directory: IAMFrontEnd
        run: npm ci

      - name: Build frontend
        working-directory: IAMFrontEnd
        run: npm run build

