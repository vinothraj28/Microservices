name: Trigger auto deployment for gateway-backend

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/gateway-backend-AutoDeployTrigger-d34d0c06-25af-4663-b6ed-ea325c370c26.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.GATEWAYBACKEND_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.GATEWAYBACKEND_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.GATEWAYBACKEND_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          dockerfilePath: gateway/gateway/Dockerfile
          registryUrl: docker.io
          registryUsername: ${{ secrets.GATEWAYBACKEND_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.GATEWAYBACKEND_REGISTRY_PASSWORD }}
          containerAppName: gateway-backend
          resourceGroup: Movie_Platform
          imageToBuild: removino68/gateway-backend:${{ github.sha }}


