syntax = "proto3";

package oauth2;
option java_package = "com.microservices.oauth2.grpc";
option java_multiple_files = true;

import "google/protobuf/timestamp.proto";

// OAuth2 Service - Authorization Server operations
service OAuth2Service {
  // Client Management
  rpc RegisterClient (RegisterClientRequest) returns (RegisterClientResponse);
  rpc GetClient (GetClientRequest) returns (GetClientResponse);
  rpc UpdateClient (UpdateClientRequest) returns (UpdateClientResponse);
  rpc DeleteClient (DeleteClientRequest) returns (DeleteClientResponse);
  
  // Authorization Flow
  rpc Authorize (AuthorizeRequest) returns (AuthorizeResponse);
  
  // Token Operations
  rpc Token (TokenRequest) returns (TokenResponse);
  rpc IntrospectToken (IntrospectTokenRequest) returns (IntrospectTokenResponse);
  rpc RevokeToken (RevokeTokenRequest) returns (RevokeTokenResponse);
}

// ==================== Client Registration ====================

message RegisterClientRequest {
  string client_name = 1;
  repeated string redirect_uris = 2;
  repeated string scopes = 3;
  ClientType client_type = 4; // PUBLIC or CONFIDENTIAL
  repeated GrantType grant_types = 5;
  string application_type = 6; // web, native, spa
  string logo_uri = 7;
  string client_uri = 8;
  string policy_uri = 9;
  string tos_uri = 10;
}

message RegisterClientResponse {
  string client_id = 1;
  string client_secret = 2; // Only for CONFIDENTIAL clients, empty for PUBLIC
  string client_name = 3;
  repeated string redirect_uris = 4;
  repeated string scopes = 5;
  ClientType client_type = 6;
  repeated GrantType grant_types = 7;
  google.protobuf.Timestamp created_at = 8;
  int64 client_secret_expires_at = 9; // 0 = never expires
}

message GetClientRequest {
  string client_id = 1;
}

message GetClientResponse {
  string client_id = 1;
  string client_name = 2;
  repeated string redirect_uris = 3;
  repeated string scopes = 4;
  ClientType client_type = 5;
  repeated GrantType grant_types = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  bool is_active = 9;
}

message UpdateClientRequest {
  string client_id = 1;
  optional string client_name = 2;
  repeated string redirect_uris = 3;
  repeated string scopes = 4;
  repeated GrantType grant_types = 5;
  optional bool is_active = 6;
}

message UpdateClientResponse {
  string client_id = 1;
  string message = 2;
  google.protobuf.Timestamp updated_at = 3;
}

message DeleteClientRequest {
  string client_id = 1;
}

message DeleteClientResponse {
  bool success = 1;
  string message = 2;
}

// ==================== Authorization ====================

message AuthorizeRequest {
  string response_type = 1; // "code" for authorization code flow
  string client_id = 2;
  string redirect_uri = 3;
  string scope = 4; // Space-separated scopes
  string state = 5; // Client-generated CSRF token
  string code_challenge = 6; // PKCE code challenge
  string code_challenge_method = 7; // "S256" or "plain"
  string user_id = 8; // Authenticated user ID
  string nonce = 9; // OpenID Connect nonce
}

message AuthorizeResponse {
  string authorization_code = 1;
  string state = 2;
  string redirect_uri = 3; // Full redirect URI with code and state
  int32 expires_in = 4; // Authorization code expiration in seconds
}

// ==================== Token Exchange ====================

message TokenRequest {
  GrantType grant_type = 1;
  
  // For authorization_code grant
  optional string code = 2;
  optional string redirect_uri = 3;
  optional string code_verifier = 4; // PKCE code verifier
  
  // For refresh_token grant
  optional string refresh_token = 5;
  
  // Client authentication
  string client_id = 6;
  optional string client_secret = 7; // Only for CONFIDENTIAL clients
  
  // Scope (optional, for refresh_token grant to narrow scope)
  optional string scope = 8;
}

message TokenResponse {
  string access_token = 1;
  string token_type = 2; // "Bearer"
  int32 expires_in = 3; // Access token expiration in seconds
  string refresh_token = 4;
  string scope = 5; // Space-separated granted scopes
  string id_token = 6; // OpenID Connect ID token (optional)
}

// ==================== Token Introspection ====================

message IntrospectTokenRequest {
  string token = 1;
  optional string token_type_hint = 2; // "access_token" or "refresh_token"
  string client_id = 3;
  optional string client_secret = 4;
}

message IntrospectTokenResponse {
  bool active = 1;
  
  // If active = true, include token metadata
  optional string scope = 2;
  optional string client_id = 3;
  optional string username = 4;
  optional string token_type = 5; // "Bearer"
  optional int64 exp = 6; // Expiration timestamp
  optional int64 iat = 7; // Issued at timestamp
  optional int64 nbf = 8; // Not before timestamp
  optional string sub = 9; // Subject (user ID)
  optional string aud = 10; // Audience
  optional string iss = 11; // Issuer
  optional string jti = 12; // JWT ID
}

// ==================== Token Revocation ====================

message RevokeTokenRequest {
  string token = 1;
  optional string token_type_hint = 2; // "access_token" or "refresh_token"
  string client_id = 3;
  optional string client_secret = 4;
}

message RevokeTokenResponse {
  bool success = 1;
  string message = 2;
}

// ==================== Enums ====================

enum ClientType {
  CLIENT_TYPE_UNSPECIFIED = 0;
  PUBLIC = 1; // Native apps, SPAs - cannot securely store client_secret
  CONFIDENTIAL = 2; // Server-side apps - can securely store client_secret
}

enum GrantType {
  GRANT_TYPE_UNSPECIFIED = 0;
  AUTHORIZATION_CODE = 1; // Standard authorization code flow
  REFRESH_TOKEN = 2; // Refresh access token
  CLIENT_CREDENTIALS = 3; // Machine-to-machine (not user-centric)
  PASSWORD = 4; // DEPRECATED - Direct username/password (not recommended)
  IMPLICIT = 5; // DEPRECATED - Direct token without code exchange
}

// ==================== Error Messages ====================

message OAuth2Error {
  string error = 1; // OAuth2 error code: invalid_request, invalid_client, etc.
  string error_description = 2;
  optional string error_uri = 3;
  optional string state = 4;
}
